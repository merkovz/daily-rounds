async function encrypt(obj,k,salt){let iv=crypto.getRandomValues(new Uint8Array(12));let ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(obj)));return {format:'scc-encrypted-v3',version:3,salt:bytesTo64(salt),iv:bytesTo64(iv),ciphertext:bytesTo64(ct),saved:now()}}
async function decrypt(v,k){return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(v.iv)},k,b64ToBytes(v.ciphertext))))}
function secure(){return !!(window.crypto&&crypto.subtle)}function storeRead(){try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch{return null}}
async function save(){if(!data)return;try{localStorage.setItem(STORE,JSON.stringify({format:'scc-local-demo-v4',data,saved:now()}));updateStatus()}catch(e){notify('Local save unavailable in this browser. Use Safari over HTTPS: '+e.message,true)}}
let saveQueue=Promise.resolve();function queueSave(){saveQueue=saveQueue.then(save);return saveQueue}
function audit(label){data.audit=(data.audit||[]).slice(-149);data.audit.push({at:now(),label});queueSave();render()}
function getPatient(){return data?.patients.find(p=>p.id===selected)}

class="patientlist">${patientList()}</div></aside><main class="main"><header class="topbar"><div class="row"><button class="btn icon menu" onclick="toggleMenu()">☰</button>${view==='patient'?'<button class="btn sm mobileback" onclick="navigate(\'list\')">← Census</button>':''}<h1>${topTitle()}</h1></div><div class="row"><span class="tiny muted desktoponly" id="saveStatus">Local demo</span><button class="btn sm desktoponly" onclick="quickAddMenu()">＋ Quick add</button></div></header><div class="content">${mainContent()}</div></main><div class="floating"><button onclick="navigate('dashboard')" class="${mobileMode==='dashboard'?'active':''}"><span class="ico">◫</span>Overview</button><button onclick="navigate('list')" class="${mobileMode==='list'?'active':''}"><span class="ico">☷</span>Census</button><button onclick="navigate('tasks')"><span class="ico">☑</span>Tasks</button><button onclick="quickAddMenu()"><span class="ico">⊕</span>Add</button><button onclick="toggleMenu()"><span class="ico">☰</span>Menu</button></div></div>${modal?modalHtml():''}`;updateStatus()}

function patientList(){let ps=data.patients.filter(p=>(filter==='all'||filter===p.service||filter===p.status||(filter==='Critical'&&p.acuity==='Critical')||(filter==='Male'&&p.ward==='Male ward')||(filter==='Female'&&p.ward==='Female ward')||(filter==='New admission'&&p.admissionType==='New admission'))&&[p.code,p.bed,p.diagnosis,p.service,p.sex,p.ward,p.admissionType].join(' ').toLowerCase().includes(search.toLowerCase())).sort((a,b)=>({Critical:0,Watch:1,Stable:2}[a.acuity]??3)-({Critical:0,Watch:1,Stable:2}[b.acuity]??3));if(!ps.length)return `<div class="empty"><div class="giant">🗂</div>No matching patients.<br><span class="small">Create a case to begin.</span></div>`;return ps.map(p=>`<div class="pitem ${selected===p.id&&view==='patient'?'active':''}" onclick="selectPatient('${p.id}')"><div class="row spread"><div class="row"><span class="dot ${p.acuity==='Critical'?'red':p.acuity==='Watch'?'amber':''}"></span><span class="pname">${esc(p.code)}</span></div><span class="tag ${p.acuity==='Critical'?'critical':p.acuity==='Watch'?'high':'good'}">${esc(p.acuity)}</span></div><div class="small muted" style="margin:5px 0 7px">${esc(p.ward||'Ward unassigned')} • ${esc(p.bed||'No bed')} • ${esc(p.service)} • ${esc(p.sex||'—')}, ${esc(p.age||'—')}y</div><div class="small break">${esc(p.diagnosis||'Diagnosis pending')}</div><div class="row spread" style="margin-top:8px"><span class="tiny muted">${esc(p.status)} ${pod(p)?'• '+pod(p):''}</span><span class="tiny" style="color:var(--amber)">${p.tasks.filter(t=>!t.done).length} pending</span></div></div>`).join('')}
function topTitle(){return ({dashboard:'Command overview',list:'Patient census',patient:getPatient()?.code||'Patient',tasks:'Task board',handover:'Handover studio',analytics:'Clinical trends',templates:'Clinical templates',settings:'Vault & settings'})[view]||'Command center'}
function mainContent(){switch(view){case'patient':return patientView();case'list':return dashboard(true);case'tasks':return taskBoard();case'handover':return handover();case'analytics':return analytics();case'templates':return templatesView();case'settings':return settingsView();default:return dashboard(false)}}
function pod(p){if(!p.operationDate)return '';let a=new Date(p.operationDate+'T12:00:00'),b=new Date(date()+'T12:00:00'),days=Math.round((b-a)/86400000);return days>=0?'POD '+days:(Math.abs(days)+'d to OT')}
function los(p){if(!p.admitDate)return '—';return Math.max(0,Math.round((new Date(date()+'T12:00:00')-new Date(p.admitDate+'T12:00:00'))/86400000))+'d'}
function wardQuickGroups(active){let groups=[['Male ward',p=>p.ward==='Male ward'],['Female ward',p=>p.ward==='Female ward'],['ICU',p=>p.ward==='ICU'||p.service==='ICU'],['New admissions',p=>p.admissionType==='New admission']];return `<div class="round-groups">${groups.map(([title,test])=>{let rows=active.filter(test);return `<section class="round-group"><div class="row spread"><b>${title}</b><span class="tag">${rows.length}</span></div>${rows.length?rows.slice(0,4).map(p=>`<button class="ward-pick" onclick="selectPatient('${p.id}')"><span>${esc(p.code)}</span><span class="small muted">${esc(p.bed||p.diagnosis||'Open case')}</span></button>`).join(''):'<div class="small muted">No active cases</div>'}</section>`}).join('')}</div>`}

const DAILY_ROUND_MOTIVATION=["Every careful assessment makes a difference.","Progress is built one patient, one decision, one day at a time.","Great surgeons keep learning, even on the busiest days.","Be curious, be thorough, and always put patient safety first.","Small improvements in your practice become lasting skills.","Prepare with purpose. Round with confidence. Learn with humility.","Every clinical question is an opportunity to grow.","Calm thinking and careful reassessment are powerful tools.","Consistency today creates confidence tomorrow.","Your effort matters, even when nobody notices.","Listen closely. Examine carefully. Communicate clearly.","One thoughtful decision at a time.","Good teams make great care possible.","Knowledge grows when you ask the next question.","Stay steady through the difficult cases.","Strong surgical judgment starts with good observation.","Your future expertise is shaped by today’s practice.","Celebrate progress, stay open to feedback.","Work carefully, not just quickly.","Every handover is a chance to protect a patient.","Confidence comes from preparation and practice.","Take pride in showing up ready to learn.","The best clinicians remain students throughout their careers.","Your patients benefit from your curiosity and compassion.","Stay focused on what matters most right now.","Learning something new today is a win.","Persistence and humility belong together.","End the day knowing you gave thoughtful care.","Think clearly, speak kindly, document accurately.","One safe step at a time."];
function dailyMotivation(){const today=date();const dayIndex=Math.floor(Date.parse(today+'T12:00:00')/86400000);const quote=DAILY_ROUND_MOTIVATION[((dayIndex%DAILY_ROUND_MOTIVATION.length)+DAILY_ROUND_MOTIVATION.length)%DAILY_ROUND_MOTIVATION.length];const hour=new Date().getHours();const greeting=hour<12?'Good morning':hour<17?'Good afternoon':'Good evening';return `<section class="card" style="margin-bottom:14px;border-color:#305d63;background:linear-gradient(120deg,#112a35,#111a2b)"><div class="small" style="color:var(--brand);font-weight:750;letter-spacing:.07em;text-transform:uppercase">☀ Daily motivation</div><div style="font-size:18px;font-weight:760;margin-top:7px">${greeting}, doctor.</div><p style="margin:5px 0 0;line-height:1.55;color:var(--txt)">${esc(quote)}</p><div class="tiny muted" style="margin-top:9px">A fresh message each day • ${human(today)}</div></section>`;}
function dashboard(isList){let active=data.patients.filter(p=>p.status==='Active'),crit=active.filter(p=>p.acuity==='Critical'),open=active.flatMap(p=>p.tasks.filter(t=>!t.done)),urgent=open.filter(t=>t.priority==='High');return `<div class="sectiontitle"><div><h2>${isList?'Ward census':'Good to see you, doctor'}</h2><div class="small muted">${human(date())} • Surgical rounds workspace • De-identified case codes only</div></div><button class="btn primary" onclick="openModal('patient')">＋ New case</button></div>${!isList?dailyMotivation():""}${wardQuickGroups(active)}<div class="metrics"><div class="metric"><div class="label">Active patients</div><div class="num">${active.length}</div></div><div class="metric"><div class="label">Critical / high acuity</div><div class="num" style="color:var(--red)">${crit.length}</div></div><div class="metric"><div class="label">Open tasks</div><div class="num">${open.length}</div></div><div class="metric"><div class="label">High-priority actions</div><div class="num" style="color:var(--amber)">${urgent.length}</div></div></div><div class="twocol"><section class="card"><div class="sectiontitle"><h3>Priority board</h3><button class="btn sm" onclick="navigate('tasks')">View all</button></div>${urgent.length?urgent.slice(0,7).map(x=>taskRow(x,data.patients.find(p=>p.tasks.includes(x)),true)).join(''):'<div class="small muted">No outstanding high-priority tasks.</div>'}</section><section class="card"><div class="sectiontitle"><h3>Active patient snapshot</h3><button class="btn sm" onclick="navigate('handover')">Build handover</button></div>${active.length?active.slice(0,7).map(p=>`<div class="task" style="cursor:pointer" onclick="selectPatient('${p.id}')"><div class="dot ${p.acuity==='Critical'?'red':p.acuity==='Watch'?'amber':''}" style="margin-top:6px"></div><div style="flex:1"><div class="strong">${esc(p.code)} <span class="muted small">${esc(p.bed||'')}</span></div><div class="small muted">${esc(p.diagnosis)} ${pod(p)?'• '+pod(p):''}</div></div><span class="tag">${p.tasks.filter(t=>!t.done).length} tasks</span></div>`).join(''):'<div class="empty">Create your first de-identified case.</div>'}</section></div><div class="card"><h3>Start-of-round workflow</h3><div class="threecol"><div><b>1. Before rounds</b><p class="small muted">Review overnight events, new blood results, imaging, drains and outstanding referrals.</p></div><div><b>2. During rounds</b><p class="small muted">Update subjective/objective findings; record consultant assessment and action plan.</p></div><div><b>3. After rounds</b><p class="small muted">Assign urgent tasks, close completed actions and produce a handover.</p></div></div></div><div class="notice">NO PASSWORD / NO ENCRYPTION: Use only fictional or properly de-identified cases. Clinical safety: this is an independent learning/prototype tool, not a source of truth for patient care. Confirm orders, results, procedures and handovers in the approved clinical record.</div>`}
function patientView(){let p=getPatient();if(!p)return '';return `<div class="hero"><div class="row spread wrap"><div><div class="tiny" style="color:#9ee4d4;letter-spacing:1.2px;font-weight:800">${esc(p.service).toUpperCase()} • ${esc(p.status)}</div><h2>${esc(p.code)} <span class="muted" style="font-size:14px;font-weight:500">${esc(p.ward||'Ward unassigned')} • ${esc(p.bed||'No bed')}</span></h2><div class="meta"><span>${esc(p.age||'—')} years • ${esc(p.sex||'—')}</span><span>Admitted ${human(p.admitDate)} • LOS ${los(p)}</span>${pod(p)?`<span>${pod(p)}</span>`:''}<span class="tag ${p.acuity==='Critical'?'critical':p.acuity==='Watch'?'high':'good'}">${esc(p.acuity)}</span></div><p style="margin:13px 0 0;font-weight:750">${esc(p.diagnosis||'Diagnosis not recorded')}</p></div><div class="row wrap"><button class="btn sm" onclick="openModal('patient-edit')">Edit profile</button><button class="btn sm" onclick="archiveCase()">Archive</button><button class="btn primary sm" onclick="openModal('soap')">＋ Daily round</button></div></div>${p.alerts?`<div class="notice" style="margin-bottom:0">⚠ ${esc(p.alerts)}</div>`:''}</div><div class="tabs">${[['chart','Full chart'],['overview','Snapshot'],['rounds','Daily SOAP'],['labs','Labs & trends'],['imaging','Imaging'],['referrals','Referrals'],['tasks','Tasks'],['timeline','Timeline']].map(([t,l])=>`<button onclick="setTab('${t}')" class="tab ${tab===t?'active':''}">${l}</button>`).join('')}</div>${patientTab(p)}`}
function patientTab(p){switch(tab){case'chart':return fullChart(p);case'rounds':return roundsTab(p);case'labs':return labsTab(p);case'imaging':return imagingTab(p);case'referrals':return referralTab(p);case'tasks':return tasksTab(p);case'timeline':return timelineTab(p);default:return overviewTab(p)}}
const inlineText=x=>esc(x||'Not recorded').replace(/\n/g,'<br>');
function fullChart(p){return `<div class="sectiontitle"><h2>One-page longitudinal patient chart</h2><button class="btn sm" onclick="window.print()">Print chart</button></div>${overviewTab(p)}${roundsTab(p)}${labsTab(p)}${imagingTab(p)}${referralTab(p)}${tasksTab(p)}${timelineTab(p)}`}
function overviewTab(p){let latest=[...p.notes].sort((a,b)=>b.at.localeCompare(a.at))[0];return `<div class="twocol"><section class="card"><div class="sectiontitle"><h3>Patient fundamentals</h3><button class="btn sm" onclick="copyConsultantSummary('${p.id}')">Copy presentation</button><button class="btn sm" onclick="openModal('patient-edit')">Edit</button></div>${detail('Ward / area',p.ward||'Unassigned')}${detail('Admission category',p.admissionType||'Existing patient')}${detail('Age / sex / occupation',[p.age?p.age+' years':'—',p.sex,p.occupation].filter(Boolean).join(' • '))}${detail('Medical history',p.pmh)}${detail('Surgical history',p.psh)}${detail('Drug history',p.meds)}${detail('Allergies',p.allergies)}${detail('Procedure',p.procedure)}${detail('Date of operation',p.operationDate?human(p.operationDate):'Not recorded')}${detail('Disposition / destination',p.disposition)}</section><section class="card"><div class="sectiontitle"><h3>Admission narrative</h3><button class="btn sm" onclick="openModal('patient-edit')">Edit</button></div>${detail('History of presenting illness',p.presentation)}${detail('Hospital course / backstory',p.course)}${detail('Current diagnosis',p.diagnosis)}${detail('Safety notes / action thresholds',p.alerts)}</section></div><div class="twocol"><section class="card"><div class="sectiontitle"><h3>Latest round</h3><button class="btn sm" onclick="setTab('rounds')">History</button></div>${latest?`<div class="small muted" style="margin-bottom:11px">${human(latest.at)} • ${esc(latest.author)}</div>${[['Subjective',latest.s],['Objective',latest.o],['Assessment',latest.a],['Plan',latest.p]].map(([a,b])=>detail(a,b)).join('')}`:'<div class="small muted">No round documented. Add today’s SOAP.</div>'}<button class="btn primary sm" onclick="openModal('soap')">＋ Add round</button></section><section class="card"><div class="sectiontitle"><h3>Outstanding actions</h3><button class="btn sm" onclick="openModal('task')">＋ Task</button></div>${p.tasks.filter(x=>!x.done).length?p.tasks.filter(x=>!x.done).slice(0,8).map(t=>taskRow(t,p,false)).join(''):'<div class="small muted">No outstanding tasks.</div>'}</section></div><div class="twocol"><section class="card"><div class="sectiontitle"><h3>Latest labs</h3><button class="btn sm" onclick="setTab('labs')">Compare →</button></div>${labTable(p,true)}</section><section class="card"><div class="sectiontitle"><h3>Recent investigations & reviews</h3><button class="btn sm" onclick="setTab('timeline')">Timeline →</button></div>${[...p.imaging.map(x=>({...x,label:x.modality,detail:x.finding})),...p.referrals.map(x=>({...x,label:x.specialty,detail:x.recommendation}))].sort((a,b)=>b.at.localeCompare(a.at)).slice(0,4).map(x=>`<div class="entry"><span class="date">${human(x.at)}</span><div class="title">${esc(x.label)}</div><p class="small">${esc(x.detail)}</p></div>`).join('')||'<div class="small muted">Nothing recorded yet.</div>'}</section></div>`}
function detail(name,value){return `<div style="margin-bottom:14px"><div class="tiny muted" style="text-transform:uppercase;letter-spacing:.65px;font-weight:800;margin-bottom:4px">${esc(name)}</div><div style="white-space:pre-wrap;overflow-wrap:anywhere">${inlineText(value)}</div></div>`}
function roundsTab(p){return `<section class="card"><div class="sectiontitle"><h3>Longitudinal daily SOAP</h3><div class="row"><button class="btn sm" onclick="copyConsultantSummary('${p.id}')">Copy presentation</button><button class="btn sm" onclick="copyRound('${p.id}')">Copy latest</button><button class="btn primary sm" onclick="openModal('soap')">＋ SOAP</button></div></div>${p.notes.length?[...p.notes].sort((a,b)=>b.at.localeCompare(a.at)).map(n=>`<div class="entry"><div class="row spread"><div class="date">${human(n.at)} • ${esc(n.author||'Team')}</div><button class="btn sm" onclick="copyNote('${p.id}','${n.id}')">Copy</button></div>${[['S',n.s],['O',n.o],['A',n.a],['P',n.p]].map(([t,v])=>`<p><b style="color:var(--brand)">${t}:</b> ${inlineText(v)}</p>`).join('')}</div>`).join(''):'<div class="empty">No rounds documented.</div>'}</section>`}
function latestLabs(p){let obj={};for(let r of [...p.labs].sort((a,b)=>a.at.localeCompare(b.at)))obj[r.test]=(obj[r.test]||[]).concat(r);return obj}
function labTable(p,compact=false){let lab=latestLabs(p),arr=Object.entries(lab);if(!arr.length)return'<p class="small muted">No lab values entered.</p>';return `<div class="tablewrap"><table class="data-table"><thead><tr><th>Test</th><th>Previous</th><th>Latest</th><th>Change</th>${compact?'':'<th>Date</th>'}</tr></thead><tbody>${arr.map(([test,rows])=>{let last=rows.at(-1),prev=rows.at(-2),delta=prev?Number(last.value)-Number(prev.value):null;return `<tr><td><b>${esc(test)}</b> <span class="tiny muted">${esc(units[test]||'')}</span></td><td class="mono">${prev?esc(prev.value):'—'}</td><td class="mono strong">${esc(last.value)}</td><td class="mono ${delta>0?'delta up':delta<0?'delta down':''}">${delta===null?'—':(delta>0?'↑ ':delta<0?'↓ ':'= ')+Math.abs(delta).toLocaleString(undefined,{maximumFractionDigits:2})}</td>${compact?'':`<td class="muted">${human(last.at)}</td>`}</tr>`}).join('')}</tbody></table></div><p class="tiny muted" style="margin:9px 0 0">Arrows show numeric direction only, not whether a result is clinically better or worse. Units and reference ranges must be checked against the laboratory.</p>`}
function labsTab(p){let tests=Object.keys(latestLabs(p));if(tests.length&&!tests.includes(labPick))labPick=tests[0];return `<div class="card"><div class="sectiontitle"><h3>Serial laboratory comparison</h3><button class="btn primary sm" onclick="openModal('lab')">＋ Add labs</button></div>${labTable(p)}</div><div class="card"><div class="sectiontitle"><h3>Trend visualization</h3><div>${tests.length?`<select class="btn" onchange="pickLab(this.value)">${tests.map(t=>`<option ${labPick===t?'selected':''}>${esc(t)}</option>`).join('')}</select>`:''}</div></div>${labChart(p,labPick)}<div class="small muted">Raw values and dates are preserved in this browser only (not encrypted). Do not use these graphs for clinical decision support.</div></div>`}
function labChart(p,test){let rows=p.labs.filter(x=>x.test===test).sort((a,b)=>a.at.localeCompare(b.at));if(!rows.length)return'<div class="empty">Add a laboratory result to generate a trend.</div>';let vals=rows.map(x=>Number(x.value)),lo=Math.min(...vals),hi=Math.max(...vals);if(hi===lo){hi+=1;lo-=1}let pad=(hi-lo)*.18;lo-=pad;hi+=pad;let w=680,h=235,xAt=i=>50+(rows.length===1?290:i*600/(rows.length-1)),yAt=v=>185-(v-lo)*140/(hi-lo),pts=rows.map((r,i)=>`${xAt(i)},${yAt(+r.value)}`).join(' ');return `<div class="chart"><svg role="img" aria-label="${esc(test)} lab trend" viewBox="0 0 700 240" width="700"><line x1="50" y1="185" x2="650" y2="185" stroke="#45607e"/><line x1="50" y1="45" x2="50" y2="185" stroke="#45607e"/>${[0,.5,1].map(i=>`<line x1="50" y1="${45+i*140}" x2="650" y2="${45+i*140}" stroke="#274058" stroke-dasharray="4 5"/><text x="43" y="${48+i*140}" text-anchor="end" font-size="12" fill="#91a3bd">${(hi-i*(hi-lo)).toFixed(1)}</text>`).join('')}<polyline points="${pts}" fill="none" stroke="#5fd0bc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${rows.map((r,i)=>`<circle cx="${xAt(i)}" cy="${yAt(+r.value)}" r="5" fill="#5fd0bc" stroke="#102337" stroke-width="2"/><text x="${xAt(i)}" y="${Math.max(18,yAt(+r.value)-12)}" text-anchor="middle" fill="#e5fcf6" font-size="12">${esc(r.value)}</text><text x="${xAt(i)}" y="207" text-anchor="middle" fill="#a6bad3" font-size="10">${esc(r.at.slice(5))}</text>`).join('')}</svg></div><div class="chartkey"><b>${esc(test)}</b>${esc(units[test]||'')} • ${rows.length} observations</div>`}
function imagingTab(p){return recordsTab(p,'imaging','Imaging & CT log','imaging',x=>`${esc(x.modality)}${x.action?' • Action: '+esc(x.action):''}`,x=>x.finding)}
function referralTab(p){return recordsTab(p,'referrals','Specialty consultations','referral',x=>`${esc(x.specialty)} • ${esc(x.clinician||'Consulting team')}`,x=>`Question: ${x.question}\nRecommendations: ${x.recommendation}\nFollow-up: ${x.followup}`)}

function taskBoard(){let groups=['High','Medium','Routine'],patients=data.patients.filter(p=>p.status==='Active');return `<div class="sectiontitle"><div><h2>Outstanding action board</h2><div class="small muted">Across all active surgical patients</div></div><button class="btn primary" onclick="quickAdd('task')">＋ Add task</button></div>${groups.map(pr=>{let tasks=patients.flatMap(p=>p.tasks.filter(t=>!t.done&&t.priority===pr).map(t=>({p,t})));return `<div class="card"><h3><span class="priority ${pr==='High'?'high':pr==='Medium'?'medium':'low'}">●</span> ${pr} priority <span class="tag">${tasks.length}</span></h3>${tasks.length?tasks.map(({p,t})=>taskRow(t,p,true)).join(''):'<div class="small muted">All clear.</div>'}</div>`}).join('')}<div class="card"><h3>Completed tasks</h3>${patients.flatMap(p=>p.tasks.filter(t=>t.done).map(t=>taskRow(t,p,true))).slice(0,12).join('')||'<span class="muted small">None yet.</span>'}</div>`}
function timelineTab(p){let all=[...p.events.map(x=>({...x,heading:x.title,body:x.detail})),...p.notes.map(x=>({...x,heading:'Daily SOAP',body:x.a+'\nPlan: '+x.p})),...p.imaging.map(x=>({...x,heading:x.modality+' imaging',body:x.finding})),...p.referrals.map(x=>({...x,heading:x.specialty+' consultation',body:x.recommendation}))].sort((a,b)=>b.at.localeCompare(a.at));return `<section class="card"><div class="sectiontitle"><h3>Clinical course chronology</h3><button class="btn primary sm" onclick="openModal('event')">＋ Event</button></div><div class="timeline">${all.length?all.map(x=>`<div class="timeitem"><div class="date">${human(x.at)}</div><div class="strong">${esc(x.heading)}</div><p class="small">${esc(x.body||'')}</p></div>`).join(''):'<div class="muted">No timeline events recorded.</div>'}</div></section>`}
function analytics(){let active=data.patients.filter(p=>p.status==='Active');let byService=active.reduce((o,p)=>(o[p.service]=(o[p.service]||0)+1,o),{});let done=data.patients.flatMap(p=>p.tasks).filter(t=>t.done).length,all=data.patients.flatMap(p=>p.tasks).length;return `<h2>Clinical workload overview</h2><p class="small muted">Administrative snapshot only. These metrics do not validate care quality or patient outcomes.</p><div class="metrics"><div class="metric"><div class="label">Notes entered</div><div class="num">${data.patients.reduce((a,p)=>a+p.notes.length,0)}</div></div><div class="metric"><div class="label">Imaging reviews</div><div class="num">${data.patients.reduce((a,p)=>a+p.imaging.length,0)}</div></div><div class="metric"><div class="label">Specialty referrals</div><div class="num">${data.patients.reduce((a,p)=>a+p.referrals.length,0)}</div></div><div class="metric"><div class="label">Tasks completed</div><div class="num">${all?Math.round(done/all*100):0}%</div></div></div><div class="card"><h3>Census by service</h3>${Object.entries(byService).map(([k,n])=>`<div style="margin:11px 0"><div class="row spread"><b>${esc(k)}</b><span>${n}</span></div><div class="progress"><div style="width:${n/Math.max(active.length,1)*100}%"></div></div></div>`).join('')||'No active cases.'}</div><div class="card"><h3>Safety-focused round prompts</h3><p>For each patient, consider explicitly documenting deterioration/NEWS or local equivalent, antibiotics and cultures, VTE prophylaxis, fluid balance, analgesia, nutrition, wound and drain status, imaging follow-up, consultant decisions, and discharge barriers as relevant. These are prompts, not automated recommendations.</p></div>`}
function handoverText(){let ps=data.patients.filter(p=>p.status==='Active');return ['SURGICAL HANDOVER — '+human(date()),'DE-IDENTIFIED PROTOTYPE • VERIFY IN HOSPITAL EHR','',...ps.flatMap(p=>{let n=[...p.notes].sort((a,b)=>b.at.localeCompare(a.at))[0];return [`${p.code} | ${p.bed||'Bed ?'} | ${p.service} | ${p.acuity} | ${pod(p)}`.trim(),`Diagnosis: ${p.diagnosis}`,`Background: ${p.course||p.presentation||'—'}`,`Latest assessment: ${n?.a||'—'}`,`Plan: ${n?.p||'—'}`,`High-priority tasks: ${p.tasks.filter(t=>!t.done&&t.priority==='High').map(t=>t.text).join('; ')||'None listed'}`,`Other pending: ${p.tasks.filter(t=>!t.done&&t.priority!=='High').map(t=>t.text).join('; ')||'None listed'}`,''];})].join('\n')}

function printHandover(){let win=window.open('','_blank');if(!win){notify('Popup blocked',true);return}win.document.write('<html><head><title>De-identified handover</title><style>body{font:13px/1.6 Arial;padding:25px}pre{white-space:pre-wrap}</style></head><body><pre>'+esc(handoverText())+'</pre></body></html>');win.document.close();win.focus();win.print()}
const templates={Thoracic:{name:'Thoracic surgery ward round',s:'Dyspnea / pleuritic pain / cough / fever / mobilization / oral intake / analgesia:',o:'Vitals, oxygen requirement, chest examination, wound, chest drain: side / suction or seal / 24h output / color / air leak at rest and cough, CXR, CBC/CRP:',a:'Diagnosis, procedure, POD, stability, postoperative issues:',p:'Oxygen as indicated, analgesia, pulmonary hygiene, early mobilization, drain and imaging plan, VTE plan, follow-up and disposition:'},'General Surgery':{name:'General surgery ward round',s:'Pain, nausea/vomiting, oral intake, bowel movement/flatus, ambulation, fever:',o:'Vitals, hydration, abdominal exam, wound, drain output, fluid balance, CBC/U&E/CRP, indicated imaging:',a:'Working diagnosis, procedure, POD, active problems:',p:'Diet, fluids, analgesia, antibiotics review, VTE prophylaxis, wound/drain plan, pending investigations, discharge criteria:'},ICU:{name:'ICU surgical patient review',s:'Sedation / pain / neurologic symptoms where assessable:',o:'Neuro GCS/RASS; respiratory airway/vent mode/FiO₂/PEEP/ABG; circulation BP/MAP/HR/vasopressors; urine output/fluid balance; infection/labs/cultures; lines/tubes/nutrition:',a:'Problem-oriented: respiratory, circulatory, infection/source control, renal, nutrition, other:',p:'Airway/vent plan, hemodynamic targets per treating team, antimicrobials and cultures, source control, fluids/renal monitoring, prophylaxis, daily device review:'}};

function settingsView(){return `<h2>Local demo storage & backup</h2><div class="notice">⚠ NO PASSWORD AND NO ENCRYPTION. Do not enter names, medical record numbers, dates of birth, identifiable histories, or real patient information. Use fictional or properly de-identified teaching cases only. This app is not a hospital EHR.</div><div class="twocol"><section class="card"><h3>Backup / restore</h3><p class="small muted">Backups are readable JSON files, not encrypted. Store them carefully; clearing Safari website data may erase local entries.</p><div class="row wrap"><button class="btn primary" onclick="exportVault()">↓ Export demo backup</button><button class="btn" onclick="$('#importFile').click()">↑ Import demo backup</button><input type="file" id="importFile" accept=".json,application/json" hidden onchange="importVault(this.files[0])"></div></section><section class="card"><h3>Maintenance</h3><button class="btn" onclick="loadSamples()">Add fictional demo cases</button><button class="btn danger" onclick="deleteVault()">Erase local demo data</button><p class="small muted">For reliable saving on iPhone, open the site from HTTPS in Safari. Data is not synchronized between devices.</p></section></div>`}
function renderVault(){let exists=!!storeRead();$('#root').innerHTML=`<div class="vaultscreen"><div class="vaultbox"><div class="row" style="margin-bottom:12px"><div class="logo">✚</div><div><div class="brand-title" style="font-size:18px">Surgical Command Center</div><div class="small muted">Personal surgical workflow • offline vault</div></div></div><h1>${exists?'Unlock your workspace':'Create your encrypted workspace'}</h1><p class="muted">A longitudinal ward-round system for general surgery, thoracic surgery and ICU.</p><form onsubmit="vaultSubmit(event)"><div class="field"><label>Vault passphrase ${exists?'':'(minimum 10 characters)'}</label><input autocomplete="off" type="password" name="password" id="pw" required minlength="${exists?1:10}" placeholder="Enter a strong unique passphrase"></div>${exists?'':`<div class="field"><label>Confirm passphrase</label><input type="password" id="pw2" required minlength="10" placeholder="Repeat your passphrase"></div><div class="checkline"><input type="checkbox" id="ack" required><label for="ack" class="small">I will use fictional or properly de-identified cases only; this is not an approved clinical record.</label></div>`}<button id="unlockbtn" type="submit" class="btn primary" style="width:100%;margin-top:10px">${exists?'Unlock vault':'Create encrypted vault'}</button></form><div class="notice">No online account, server, or password recovery. Stored data is encrypted in this browser. Keep encrypted backups. For real patients, use hospital-approved systems.</div>${exists?'<div class="row spread"><button class="btn ghost sm" onclick="recoverImport()">Restore an encrypted backup</button><button class="btn ghost sm" onclick="deleteVault()">Reset local vault</button></div>':''}</div></div>`}
async function vaultSubmit(e){e.preventDefault();let pass=$('#pw').value,existing=storeRead(),btn=$('#unlockbtn');btn.disabled=true;btn.textContent='Processing encryption…';try{if(existing){key=await derive(pass,b64ToBytes(existing.salt));data=await decrypt(existing,key);data.patients=data.patients||[];data.audit=data.audit||[]}else{if(pass!==$('#pw2').value)throw Error('Passphrases do not match');let salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(pass,salt);data=emptyData();localStorage.setItem(STORE,JSON.stringify(await encrypt(data,key,salt)))}view='dashboard';mobileMode='dashboard';selected=null;render();touch()}catch(e){data=null;key=null;notify('Unable to unlock or create: '+e.message,true);renderVault()}}
function navigate(v){view=v;mobileMode=(v==='list'?'list':'dashboard');menuOpen=false;render()}function selectPatient(id){selected=id;view='patient';tab='chart';mobileMode='patient';menuOpen=false;render()}function setTab(t){tab=t;render()}function setSearch(s){search=s;let list=$('.patientlist');if(list)list.innerHTML=patientList()}function setFilter(f){filter=f;render()}function toggleMenu(){menuOpen=!menuOpen;render()}function pickLab(t){labPick=t;render()}

function toggleTask(pid,tid,done){let p=data.patients.find(p=>p.id===pid),t=p?.tasks.find(t=>t.id===tid);if(!t)return;t.done=done;t.completedAt=done?now():null;audit((done?'Completed':'Reopened')+' task '+tid);notify(done?'Task completed':'Task reopened')}
function copyText(s){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(s).then(()=>notify('Copied to clipboard')).catch(()=>fallbackCopy(s))}else fallbackCopy(s)}function fallbackCopy(s){let t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();let ok=document.execCommand('copy');t.remove();notify(ok?'Copied to clipboard':'Copy unavailable — try manual selection',!ok)}

function copyNote(pid,nid){let p=data.patients.find(p=>p.id===pid),n=p.notes.find(n=>n.id===nid);copyText(noteText(p,n))}function copyRound(pid){let p=data.patients.find(p=>p.id===pid),n=[...p.notes].sort((a,b)=>b.at.localeCompare(a.at))[0];if(n)copyText(noteText(p,n));else notify('No daily note found',true)}

function fld(name,label,value='',kind='text',full=false,extras=''){let v=esc(value??'');return `<div class="field ${full?'full':''}"><label>${esc(label)}</label>${kind==='textarea'?`<textarea name="${name}" rows="3" ${extras}>${v}</textarea>`:kind==='select'?`<select name="${name}">${extras.split('|').map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input name="${name}" type="${kind}" value="${v}" ${extras}>`}</div>`}
function modalFields(t,p){let dateField=fld('at','Date / time',now().slice(0,16),'datetime-local');if(t==='patient'||t==='patient-edit'){let q=t==='patient'?{service:'General Surgery',status:'Active',acuity:'Stable',code:'',age:'',sex:'',occupation:'',bed:'',diagnosis:'',pmh:'',psh:'',meds:'',allergies:'',presentation:'',course:'',alerts:'',procedure:'',admitDate:date(),operationDate:'',disposition:''}:p;return{title:t==='patient'?'New de-identified surgical case':'Edit patient summary',html:`<div class="fieldgrid">${fld('code','Case code / non-identifying label',q.code,'text',false,'required placeholder="e.g. TH-014"')}${fld('ward','Ward / area',q.ward||'Unassigned','select',false,'Unassigned|Male ward|Female ward|ICU|Emergency|Operating theatre|Recovery|Other')}${fld('bed','Bed label (non-identifying)',q.bed)}${fld('service','Service',q.service,'select',false,'General Surgery|Thoracic|ICU|Vascular|Other')}${fld('admissionType','Admission category',q.admissionType||'Existing patient','select',false,'Existing patient|New admission|Postoperative|Consultation')}${fld('status','Status',q.status,'select',false,'Active|Discharged|Transferred|Archived')}${fld('acuity','Clinical attention level (manual)',q.acuity,'select',false,'Stable|Watch|Critical')}${fld('age','Age (years)',q.age,'number',false,'min="0" max="120"')}${fld('sex','Sex',q.sex,'select',false,'|Male|Female|Other|Not recorded')}${fld('occupation','Occupation',q.occupation)}${fld('admitDate','Admission date',q.admitDate,'date')}${fld('operationDate','Operation date',q.operationDate,'date')}${fld('diagnosis','Diagnosis / problem list',q.diagnosis,'textarea',true)}${fld('presentation','Admission presentation & HPI',q.presentation,'textarea',true)}${fld('course','Hospital course / backstory',q.course,'textarea',true)}${fld('pmh','Past medical history',q.pmh,'textarea',true)}${fld('psh','Past surgical history',q.psh,'textarea',true)}${fld('meds','Medication / drug history',q.meds,'textarea',true)}${fld('allergies','Allergy history',q.allergies,'textarea',true)}${fld('procedure','Procedure / operation',q.procedure,'textarea',true)}${fld('alerts','Critical reminders / escalation concerns',q.alerts,'textarea',true)}${fld('disposition','Discharge / transfer destination',q.disposition)}</div>`}}
if(t==='soap'){let temp=templates[p?.service]||templates['General Surgery'];return{title:'New daily SOAP round',html:`<div class="fieldgrid">${dateField}${fld('author','Author / team (non-identifying)','Surgical team')}${fld('s','S — Subjective',temp.s,'textarea',true)}${fld('o','O — Objective',temp.o,'textarea',true)}<div class="field full"><label>Chest drain documentation helper (optional)</label><div class="row wrap"><select id="drainSide"><option>Right</option><option>Left</option><option>Bilateral</option></select><select id="drainSuction"><option>Off suction</option><option>On suction</option></select><select id="drainLeak"><option>No air leak observed</option><option>Air leak observed</option><option>Air leak not assessed</option></select><input id="drainOutput" placeholder="Output (mL)" inputmode="decimal" style="max-width:150px"><button class="btn sm" type="button" onclick="addDrainToObjective()">Insert drain findings</button></div><div class="small muted">Select only findings you actually verified. Leave blank if not applicable.</div></div>${fld('a','A — Assessment',temp.a,'textarea',true)}${fld('p','P — Plan',temp.p,'textarea',true)}</div><p class="small muted">Template prompts are scaffolding only. Replace with observed findings; never chart unverified negatives.</p>`}}

if(t==='imaging')return{title:'New imaging / investigation',html:`<div class="fieldgrid">${dateField}${fld('modality','Modality','CT chest / abdomen')}${fld('finding','Key findings / comparison','', 'textarea',true)}${fld('action','Implication / follow-up action','', 'textarea',true)}</div>`};
if(t==='referral')return{title:'Specialty referral / consultation',html:`<div class="fieldgrid">${dateField}${fld('specialty','Service consulted','')}${fld('clinician','Consultant / team label','')}${fld('question','Reason for consultation','', 'textarea',true)}${fld('recommendation','Advice / recommendations','', 'textarea',true)}${fld('followup','Pending follow-up','', 'textarea',true)}</div>`};
if(t==='task')return{title:'New clinical action',html:`<div class="fieldgrid">${fld('text','Task / action','', 'textarea',true,'required')}${fld('priority','Priority','Medium','select',false,'High|Medium|Routine')}${fld('due','Target date',date(),'date')}${fld('owner','Responsible team / role','Surgical team')}</div>`};

function addDrainToObjective(){let o=document.querySelector('[name="o"]');if(!o)return;let side=$('#drainSide').value,suction=$('#drainSuction').value,leak=$('#drainLeak').value,out=$('#drainOutput').value.trim();let phrase=`${side} chest drain: ${suction.toLowerCase()}, ${leak.toLowerCase()}${out?`, output ${out} mL`:''}.`;o.value=[o.value.trim(),phrase].filter(Boolean).join('\n');o.focus()}
function consultantSummary(p){let n=[...(p.notes||[])].sort((a,b)=>b.at.localeCompare(a.at))[0],newlabs=Object.entries(latestLabs(p)).slice(0,8).map(([k,arr])=>`${k} ${arr.at(-1).value}`).join(', '),pending=(p.tasks||[]).filter(t=>!t.done).slice(0,5).map(t=>t.text).filter(Boolean).join('; '),img=[...(p.imaging||[])].sort((a,b)=>b.at.localeCompare(a.at))[0],ref=[...(p.referrals||[])].sort((a,b)=>b.at.localeCompare(a.at))[0];return [`${p.code} • ${p.age||'?'}-year-old ${p.sex||'patient'} • ${p.service||'Surgery'} • ${p.ward||'Ward unassigned'} / ${p.bed||'Bed not recorded'}`,`Background: ${p.diagnosis||'Diagnosis not entered'}. ${p.pmh?'PMH: '+p.pmh+'.':''}`,`Admission: ${p.presentation||'Not recorded'}`,p.procedure?`Procedure: ${p.procedure}${pod(p)?' ('+pod(p)+')':''}`:'',`Latest round (${n?human(n.at):'not recorded'}):`,n?`S: ${n.s||'Not recorded'}\nO: ${n.o||'Not recorded'}\nA: ${n.a||'Not recorded'}\nP: ${n.p||'Not recorded'}`:'No SOAP documented',newlabs?`Recent labs: ${newlabs}`:'',img?`Latest imaging: ${img.modality||''} — ${img.finding||''}`:'',ref?`Latest referral: ${ref.specialty||''} — ${ref.recommendation||'Pending review'}`:'',pending?`Outstanding actions: ${pending}`:''].filter(Boolean).join('\n')}
function copyConsultantSummary(pid){let p=data.patients.find(x=>x.id===pid);if(p)copyText(consultantSummary(p))}
function openModal(type){if(type!=='patient'&&!getPatient()){notify('Select a patient first',true);return}modal={type};render();setTimeout(()=>$('#entryform input')?.focus(),50)}function closeModal(){modal=null;render()}
function submitModal(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let type=modal.type,p=getPatient();if(type==='patient'){p={id:uid(),notes:[],labs:[],imaging:[],referrals:[],tasks:[],events:[],vitals:[],...f};if(data.patients.some(x=>x.code===p.code)){notify('Case code must be unique',true);return}data.patients.push(p);selected=p.id;view='patient';tab='chart';mobileMode='patient'}else if(type==='patient-edit'){if(data.patients.some(x=>x.code===f.code&&x.id!==p.id)){notify('Case code must be unique',true);return}Object.assign(p,f)}else if(type==='lab'){let lines=f.rawLabs.split('\n').map(x=>x.trim()).filter(Boolean),newRows=[];for(let line of lines){let m=line.match(/^(.+?)\s*[:=]?\s+(-?\d+(?:\.\d+)?)\s*$/);if(!m){notify('Invalid lab line: '+line,true);return}newRows.push({id:uid(),at:f.at,test:m[1].trim(),value:Number(m[2])})}p.labs.push(...newRows);tab='labs'}else if(type==='soap'){p.notes.push({id:uid(),...f});tab='rounds'}else if(type==='task'){p.tasks.push({id:uid(),...f,done:false});tab='tasks'}else if(['imaging','referral','event'].includes(type)){let collection={imaging:'imaging',referral:'referrals',event:'events'}[type];p[collection].push({id:uid(),...f});tab={imaging:'imaging',referral:'referrals',event:'timeline'}[type]}modal=null;audit('Saved '+type+' record');notify('Saved locally in this browser')}
function quickAddMenu(){modal={type:'quick'};let p=getPatient();let choices=[['patient','New patient'],['soap','Daily SOAP'],['lab','Labs'],['imaging','Imaging'],['referral','Referral'],['task','Task'],['event','Timeline event']];let backdrop=document.createElement('div');backdrop.className='modalback';backdrop.onclick=e=>{if(e.target===backdrop)backdrop.remove()};backdrop.innerHTML=`<div class="modal" style="max-width:450px"><div class="row spread"><h2>Quick add</h2><button class="btn" id="qclose">✕</button></div><div class="threecol" style="grid-template-columns:1fr 1fr">${choices.map(([t,l])=>`<button class="btn" data-q="${t}" ${!p&&t!=='patient'?'disabled':''}>＋ ${l}</button>`).join('')}</div>${!p?'<p class="small muted" style="margin-top:12px">Select a case before adding clinical entries.</p>':''}</div>`;document.body.appendChild(backdrop);$('#qclose').onclick=()=>backdrop.remove();backdrop.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{backdrop.remove();modal=null;openModal(b.dataset.q)});modal=null}
function quickAdd(t){if(!getPatient()){notify('Select a patient from the census first',true);navigate('list')}else openModal(t)}
function copyTemplate(service){let t=templates[service];if(t)copyText('S: '+t.s+'\nO: '+t.o+'\nA: '+t.a+'\nP: '+t.p)}
function quickSOAP(service){let p=getPatient();if(!p){notify('Select a patient first to use a template',true);navigate('list');return}openModal('soap')}
async function exportVault(){await queueSave();let content=localStorage.getItem(STORE)||JSON.stringify({format:'scc-local-demo-v4',data,saved:now()});let blob=new Blob([content],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='surgical-command-center-DEIDENTIFIED-UNENCRYPTED-'+date()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('Unencrypted demo backup exported')}
async function importVault(file){if(!file)return;try{let raw=JSON.parse(await file.text());if(raw.format!=='scc-local-demo-v4'||!raw.data||!Array.isArray(raw.data.patients))throw Error('Invalid demo backup; encrypted backups are not supported in passwordless mode');if(!confirm('Replace current local demo data? Export your current data first.'))return;localStorage.setItem(STORE,JSON.stringify(raw));data=raw.data;selected=null;view='dashboard';render();notify('Demo backup imported')}catch(e){notify('Import failed: '+e.message,true)}}
function recoverImport(){let el=document.createElement('input');el.type='file';el.accept='.json';el.onchange=async()=>importVault(el.files[0]);el.click()}
function loadSamples(){if(!confirm('Add two entirely fictional demonstration cases to your current vault?'))return;let s=sample();s.patients.forEach(p=>{if(data.patients.some(x=>x.code===p.code))p.code+='-'+Math.floor(Math.random()*999);data.patients.push(p)});audit('Loaded fictional sample cases');notify('Fictional cases added')}
function deleteVault(){if(!confirm('Permanently erase this browser’s local demo data? This cannot be undone without a backup.'))return;if(!confirm('Final confirmation: delete the local vault?'))return;localStorage.removeItem(STORE);data=null;key=null;render()}
/* Daily Rounds • Surgical Command Center 2.3 — local-first structured clinical workflow extension */
const oldPatientView=patientView, oldPatientTab=patientTab, oldModalFields=modalFields, oldSubmitModal=submitModal, oldQuickAddMenu=quickAddMenu, oldOverviewTab=overviewTab;
const localDate=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const localStamp=()=>{const d=new Date();return localDate()+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const options=(items,selected='')=>items.map(x=>`<option value="${esc(x)}" ${String(x)===String(selected)?'selected':''}>${esc(x)}</option>`).join('');
const sel=(name,label,values,v='')=>`<div class="field"><label>${esc(label)}</label><select name="${name}">${options(values,v)}</select></div>`;
const numberField=(name,label,v='',extra='')=>fld(name,label,v,'number',false,`step="any" ${extra}`);
const sec=(heading,body)=>`<div class="v2group"><h3>${esc(heading)}</h3><div class="fieldgrid">${body}</div></div>`;
const val=(x,unit='')=>x!==undefined&&x!==null&&String(x).trim()!==''?String(x)+(unit?' '+unit:''):'—';
const recent=(items)=>[...(items||[])].sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')))[0];
const recentDay=(items)=>[...(items||[])].filter(x=>String(x.at||'').slice(0,10)===localDate());
function ensureV2(p){for(const k of ['observations','drains','balances','medicationLog','problems','preRounds','events','vitals'])if(!Array.isArray(p[k]))p[k]=[];}
function patientStatus(p){ensureV2(p);return {obs:recent(p.observations),drain:recent(p.drains),balance:recent(p.balances),round:recent(p.notes),pre:recent(p.preRounds),med:recent(p.medicationLog)};}
function displayObs(x){if(!x)return 'No observations logged';return [`BP ${val(x.sbp)}/${val(x.dbp)}`,`HR ${val(x.hr)}`,`RR ${val(x.rr)}`,`SpO₂ ${val(x.spo2,'%')}`,`T ${val(x.temp,'°C')}`,x.oxygen&&x.oxygen!=='Room air'?`O₂ ${x.oxygen} ${x.flow?x.flow+' L/min':''}`:'Room air'].join(' · ')}
function displayDrain(x){return [x.name||'Drain',x.side||'',x.type||'',x.appearance||'',x.output!==''&&x.output!=null?`${x.output} mL ${x.interval||''}`:'',x.suction||'',x.airLeak&&x.airLeak!=='N/A'?`air leak: ${x.airLeak}`:''].filter(Boolean).join(' · ')}
function fluidSummary(x){return x?`In ${val(x.intake,'mL')} / Out ${val(x.output,'mL')} · Net ${Number.isFinite(Number(x.intake)-Number(x.output))&&x.intake!==''&&x.output!==''?(Number(x.intake)-Number(x.output))+' mL':'—'} · U/O ${val(x.urine,'mL')}`:'No balance logged'}
function snapshotItem(title,value,action){return `<div class="v2tile"><div class="v2tilehead"><b>${esc(title)}</b><button class="btn sm" onclick="openModal('${action}')">＋ Enter</button></div><div class="small">${value}</div></div>`}
function cockpit(p){ensureV2(p);const x=patientStatus(p),today=recentDay(p.preRounds),tasks=p.tasks.filter(t=>!t.done),labs=latestLabs(p),drains=p.drains.slice().sort((a,b)=>b.at.localeCompare(a.at)).slice(0,4);return `<div class="sectiontitle"><div><h2>Pre-round cockpit</h2><div class="small muted">Latest recorded findings • Verify dates, measurements and orders in the approved medical record</div></div><button class="btn primary" onclick="openModal('preround')">＋ Pre-round checklist</button></div><div class="v2banner"><div><b>Present this patient</b><div class="small muted">Generated only from information you've entered — missing items are not assumed normal</div></div><div class="row wrap"><button class="btn primary sm" onclick="showPresentation()">Clinical summary</button><button class="btn sm" onclick="copyText(presentationText(getPatient()))">Copy summary</button></div></div><div class="v2tiles">${snapshotItem('Latest vitals',esc(displayObs(x.obs)), 'observations')}${snapshotItem('Fluid balance',esc(fluidSummary(x.balance)), 'balance')}${snapshotItem('Drain / chest tube',drains.length?drains.map(d=>`<div>${esc(displayDrain(d))}</div>`).join(''):'No drain entries','drain')}${snapshotItem('Medication review',x.med?esc([x.med.drug,x.med.dose,x.med.route,x.med.frequency,x.med.status].filter(Boolean).join(' · ')):'No medication review logged','medication')}${snapshotItem('Recent labs',Object.entries(labs).length?Object.entries(labs).slice(0,7).map(([k,v])=>`${esc(k)} ${esc(v.at(-1).value)}${v.length>1?' (prev '+esc(v.at(-2).value)+')':''}`).join(' · '):'No laboratory values','lab')}${snapshotItem('Pending tasks',tasks.length?tasks.slice(0,5).map(t=>`<div>☐ ${esc(t.text)}</div>`).join(''):'No open tasks recorded','task')}</div><div class="twocol"><div class="card"><div class="sectiontitle"><h3>Problem-oriented assessment</h3><button class="btn sm" onclick="openModal('problem')">＋ Problem</button></div>${p.problems.length?p.problems.map(z=>`<div class="entry"><b>${esc(z.title)}</b> <span class="tag">${esc(z.status)}</span><p>${esc(z.assessment||'')}\nPlan: ${esc(z.plan||'—')}</p></div>`).join(''):'<span class="small muted">Add problems with individual plans for consultant rounds.</span>'}</div><div class="card"><div class="sectiontitle"><h3>Today's pre-round</h3><button class="btn sm" onclick="openModal('preround')">Update</button></div>${today.length?`<div class="small muted">Last entered ${human(today.sort((a,b)=>b.at.localeCompare(a.at))[0].at)}</div>${detail('Clinical updates',x.pre?.updates)}${detail('Examination',x.pre?.exam)}${detail('Assessment',x.pre?.assessment)}${detail('Plan',x.pre?.plan)}`:'<span class="small muted">No pre-round check documented today.</span>'}<button class="btn sm" onclick="openModal('soap')">＋ Full SOAP note</button></div></div><div class="v2banner" style="margin-top:4px"><div><b>Fast structured entries</b><div class="small muted">Choose from predefined options rather than repeatedly typing drainage appearance, suction, air leak, diet and symptoms</div></div><div class="row wrap"><button class="btn sm" onclick="openModal('drain')">Drain</button><button class="btn sm" onclick="openModal('balance')">I/O</button><button class="btn sm" onclick="openModal('medication')">Medication</button><button class="btn sm" onclick="openModal('observations')">Vitals</button></div></div>`}
function presentationText(p){if(!p)return '';ensureV2(p);let x=patientStatus(p),o=x.obs,b=x.balance,d=p.drains.slice().sort((a,b)=>b.at.localeCompare(a.at)),pending=p.tasks.filter(t=>!t.done),meds=p.medicationLog.filter(m=>m.status==='Active'),labs=latestLabs(p);let labstr=Object.entries(labs).map(([name,arr])=>{let a=arr.at(-1),prev=arr.at(-2);return `${name} ${a.value}${prev?' (previous '+prev.value+')':''}`}).slice(0,12).join('; ');const seen=x.pre||{};return [`SURGICAL ROUND PRESENTATION — ${localDate()}`,`${p.code||'Case'} | ${p.age||'Age not recorded'}y ${p.sex||''} | ${p.service||''} | ${p.ward||'Ward unassigned'} / ${p.bed||'Bed unrecorded'} | ${pod(p)||'Operation date not recorded'}`,`Diagnosis: ${p.diagnosis||'Not documented'}`,`Background: ${p.pmh||'PMH not documented'}; PSH: ${p.psh||'not documented'}.`, `Admitted: ${p.admitDate||'not documented'}. ${p.course||p.presentation||'Clinical course not documented'}`,`Overnight / subjective: ${seen.updates||x.round?.s||'Not documented'}`,`Objective: ${displayObs(o)}. ${seen.exam||x.round?.o||'Examination not documented'}`,`I/O: ${fluidSummary(b)}`,`Drains: ${d.length?d.slice(0,5).map(z=>displayDrain(z)).join(' | '):'Not documented'}`,`Recent labs: ${labstr||'Not documented'}`,`Imaging: ${recent(p.imaging)?recent(p.imaging).modality+' ('+human(recent(p.imaging).at)+'): '+recent(p.imaging).finding:'No recent imaging recorded'}`,`Referrals: ${recent(p.referrals)?recent(p.referrals).specialty+': '+recent(p.referrals).recommendation:'None recorded'}`,`Medications reviewed: ${meds.length?meds.map(m=>[m.drug,m.dose,m.route,m.frequency].filter(Boolean).join(' ')).join('; '):'No active medication entries'}`,`Assessment: ${seen.assessment||x.round?.a||p.problems.filter(z=>z.status!=='Resolved').map(z=>z.title+': '+z.assessment).join('; ')||'Not documented'}`,`Plan: ${seen.plan||x.round?.p||p.problems.filter(z=>z.status!=='Resolved').map(z=>z.title+': '+z.plan).join('; ')||'Not documented'}`,`Pending: ${pending.length?pending.map(t=>t.text).join('; '):'No pending tasks recorded'}`,`Escalation concerns: ${p.alerts||'Not documented'}`,`DRAFT — Confirm findings, medication orders, results and plan against approved medical record.`].join('\n')}
function showPresentation(){let p=getPatient();if(!p)return;let text=presentationText(p);let b=document.createElement('div');b.className='modalback';b.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="row spread"><h2>Consultant presentation</h2><button class="btn" id="presclose">✕</button></div><p class="small muted">Auto-generated from the last recorded clinical updates; not a medical interpretation.</p><pre class="presentation">${esc(text)}</pre><div class="modalfoot"><button class="btn primary" id="prescopy">Copy summary</button><button class="btn" id="presprint">Print</button></div></div>`;document.body.appendChild(b);b.onclick=e=>{if(e.target===b)b.remove()};b.querySelector('#presclose').onclick=()=>b.remove();b.querySelector('#prescopy').onclick=()=>copyText(text);b.querySelector('#presprint').onclick=()=>window.print()}
function flowsheets(p){ensureV2(p);let rows=(fields,data)=>`<div class="tablewrap"><table class="data-table"><thead><tr>${fields.map(x=>'<th>'+esc(x[1])+'</th>').join('')}</tr></thead><tbody>${[...data].sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,50).map(x=>'<tr>'+fields.map(([key])=>'<td>'+esc(x[key]??'—')+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`;return `<div class="sectiontitle"><h2>Structured clinical flowsheets</h2><div class="row wrap"><button class="btn sm" onclick="openModal('drain')">＋ Drain</button><button class="btn sm" onclick="openModal('balance')">＋ I/O</button><button class="btn sm" onclick="openModal('medication')">＋ Medication</button></div></div><section class="card"><h3>Drain output, suction and air leak history</h3>${p.drains.length?rows([['at','Recorded'],['name','Drain'],['side','Side'],['output','mL'],['interval','Period'],['appearance','Appearance'],['suction','Suction'],['airLeak','Air leak'],['site','Site']],p.drains):'<span class="muted small">No drain observations entered.</span>'}</section><section class="card"><h3>Fluid intake and output</h3>${p.balances.length?rows([['at','Recorded'],['period','Period'],['intake','Total in (mL)'],['output','Total out (mL)'],['urine','Urine (mL)'],['drainOut','Drain (mL)'],['ng','NG / GI (mL)'],['stoma','Stoma (mL)'],['bowel','Bowels']],p.balances):'<span class="muted small">No fluid-balance entries.</span>'}</section><section class="card"><h3>Medication reconciliation log (not an order chart)</h3>${p.medicationLog.length?rows([['at','Reviewed'],['drug','Medication'],['dose','Dose'],['route','Route'],['frequency','Frequency'],['indication','Indication'],['status','Status'],['monitoring','Monitoring']],p.medicationLog):'<span class="muted small">No medication entries.</span>'}</section><section class="card"><h3>Observations and oxygen history</h3>${p.observations.length?rows([['at','Recorded'],['sbp','SBP'],['dbp','DBP'],['hr','HR'],['rr','RR'],['spo2','SpO₂'],['temp','Temp'],['oxygen','Oxygen'],['fio2','FiO₂'],['peep','PEEP'],['vasopressors','Pressors']],p.observations):'<span class="muted small">No observations recorded.</span>'}</section>`}

if(t==='preround')return {title:'Structured pre-round — full SOAP',html:`<div class="small muted" style="margin-bottom:12px">Document patient-reported findings and objective examination. Use the separate quick forms to capture numeric vitals, I/O, drains, labs and medication reconciliation.</div>`+sec('Round details',dt+fld('author','Team / reviewer','Surgical team')+sel('overnight','Overnight events',['No new events reported','Pain / symptoms','Fever','Hypotension / instability','Desaturation','Bleeding','New investigation','Postoperative issue','Other','Not assessed'],'Not assessed'))+sec('S — Subjective',sel('pain','Pain',['Not assessed','None','Mild / controlled','Moderate','Severe / uncontrolled'],'Not assessed')+sel('breathing','Dyspnea',['Not assessed','None','On exertion','At rest','Worsening'],'Not assessed')+sel('oral','Oral intake / diet',['Not assessed','NPO','Sips','Clear fluids','Full fluids','Soft diet','Regular diet','Tube feeding','Not tolerating'],'Not assessed')+sel('nausea','Nausea / vomiting',['Not assessed','None','Nausea','Vomiting','Both'],'Not assessed')+sel('mobility','Mobilization',['Not assessed','Independent','With assistance','Bedbound'],'Not assessed')+fld('updates','Overnight events, symptoms and new concerns','', 'textarea',true))+sec('O — Objective',sel('general','General appearance',['Not assessed','Comfortable','Uncomfortable / in pain','Unwell / distressed','Sedated'],'Not assessed')+sel('abdomen','Abdominal examination',['Not assessed','Soft, non-tender','Soft, mildly tender','Distended','Guarding / peritonism','Other'],'Not assessed')+sel('resp','Respiratory examination',['Not assessed','Clear bilateral breath sounds','Reduced right air entry','Reduced left air entry','Bilateral reduced air entry','Crackles / wheeze','Other'],'Not assessed')+sel('wound','Wound / surgical site',['Not assessed','Clean and dry','Mild soakage','Erythematous','Discharge','Dehiscence concern','Not applicable'],'Not assessed')+fld('exam','Other objective findings, devices, relevant labs and imaging','', 'textarea',true))+sec('A — Assessment',fld('assessment','Diagnosis, POD, current clinical impression, active problems','', 'textarea',true))+sec('P — Plan',fld('plan','Consultant plan: investigations, management, referrals and disposition','', 'textarea',true)+fld('followup','Items to chase / escalation triggers','', 'textarea',true))};return oldModalFields(t,p)};
submitModal=function(e){let t=modal?.type;if(!['preround','observations','drain','balance','medication','problem'].includes(t))return oldSubmitModal(e);e.preventDefault();let p=getPatient();ensureV2(p);let f=Object.fromEntries(new FormData(e.target));f.id=uid();f.at=f.at||localStamp();if(t==='balance'){const sum=keys=>keys.reduce((s,k)=>s+(Number(f[k])||0),0);f.intake=sum(['oral','iv','feeds','blood','otherIn']);f.output=sum(['urine','drainOut','ng','stoma','otherOut']);}if(t==='preround'){let observations={id:uid(),at:f.at};p.preRounds.push(f);let sub=['Overnight: '+f.overnight,'Pain: '+f.pain,'Breathing: '+f.breathing,'Diet: '+f.oral,'N/V: '+f.nausea,'Mobility: '+f.mobility,f.updates].filter(Boolean).join('; ');let obj=['Appearance: '+f.general,'Abdomen: '+f.abdomen,'Resp: '+f.resp,'Wound: '+f.wound,f.exam].filter(Boolean).join('; ');p.notes.push({id:uid(),at:f.at,author:f.author,s:sub,o:obj,a:f.assessment,p:[f.plan,f.followup?'Follow-up: '+f.followup:''].filter(Boolean).join('\n')});}else{let field={observations:'observations',drain:'drains',balance:'balances',medication:'medicationLog',problem:'problems'}[t];p[field].push(f);}modal=null;tab='cockpit';audit('Saved structured '+t+' entry for '+p.code);notify('Saved locally in this browser')};
quickAddMenu=function(){let p=getPatient();let choices=[['patient','New case'],['preround','Pre-round SOAP'],['observations','Vitals'],['drain','Drain / ICT'],['balance','Fluid I/O'],['medication','Medication'],['problem','Problem list'],['soap','SOAP'],['lab','Labs'],['imaging','Imaging'],['referral','Referral'],['task','Task'],['event','Event']];let backdrop=document.createElement('div');backdrop.className='modalback';backdrop.innerHTML=`<div class="modal" style="max-width:500px"><div class="row spread"><h2>Quick add</h2><button class="btn" id="qclose">✕</button></div><div class="v2quick">${choices.map(([t,l])=>`<button class="btn" data-q="${t}" ${!p&&t!=='patient'?'disabled':''}>＋ ${l}</button>`).join('')}</div></div>`;document.body.appendChild(backdrop);backdrop.onclick=e=>{if(e.target===backdrop)backdrop.remove()};backdrop.querySelector('#qclose').onclick=()=>backdrop.remove();backdrop.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{backdrop.remove();openModal(b.dataset.q)})};

const v2style=document.createElement('style');v2style.textContent=`.v2banner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;padding:16px;margin-bottom:15px;background:#173044;border:1px solid #37617a;border-radius:14px}.v2tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}.v2tile{background:#122136;border:1px solid #30445d;border-radius:13px;padding:14px;min-width:0;overflow-wrap:anywhere}.v2tilehead{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px}.v2tilehead b{font-size:13px}.v2group{padding:13px 0;border-bottom:1px solid #334761}.v2group h3{font-size:15px;margin:0 0 13px;color:#81e5d2}.v2quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.presentation{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 ui-monospace,monospace;background:#0c1727;padding:16px;border-radius:12px;max-height:55vh;overflow:auto}@media(max-width:820px){.v2tiles{grid-template-columns:1fr}.v2tile{padding:13px}.v2banner{align-items:flex-start}.v2quick{grid-template-columns:repeat(2,minmax(0,1fr))}}@media print{.presentation{background:white;color:black;max-height:none}}`;document.head.appendChild(v2style);

window.addEventListener('resize',()=>{if(data)render()});try{render()}catch(e){document.querySelector('#root').innerHTML='<div style="padding:30px;color:white;font:16px Arial;background:#101a2b"><h2>Could not start app</h2><p>Open the hosted HTTPS version in Safari. Error: '+esc(e.message)+'</p></div>';}
